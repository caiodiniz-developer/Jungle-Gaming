name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# um push novo cancela a execução anterior do mesmo ramo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Tipos, lint, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # A regressão visual fica fora daqui: as baselines versionadas são do Windows
      # (sufixo -win32) e a renderização de fontes no Linux é diferente. O job
      # "baselines-linux" abaixo gera as do Linux quando for preciso.
      - run: pnpm test:e2e --grep-invert "Regressão visual"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  baselines-linux:
    name: Gerar baselines visuais do Linux
    # só sob demanda (aba Actions → Run workflow)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:update --grep "Regressão visual"
      - uses: actions/upload-artifact@v4
        with:
          name: baselines-linux
          path: tests/visual.spec.ts-snapshots
          retention-days: 7
